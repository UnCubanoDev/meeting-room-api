spring.application.name=meeting-room-api
app.version=@project.version@

# --- Servidor ---
server.port=${SERVER_PORT:8080}

# --- Base de datos (sin credenciales reales: se inyectan por variables de entorno) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/meeting_room}
spring.datasource.username=${DB_USERNAME:meeting_room}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
# El esquema lo gestiona Flyway, no Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Documentacion OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html

# --- Paginacion de los listados ---
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# --- Deserializacion estricta: 8.5 no debe convertirse en 8 ---
spring.jackson.deserialization.accept-float-as-int=false

# --- Errores en formato RFC 7807 (application/problem+json) ---
spring.mvc.problemdetails.enabled=true

# --- Reservas ---
# Zona en la que se interpreta el filtro ?date=YYYY-MM-DD del listado de reservas.
app.bookings.time-zone=${BOOKINGS_TIME_ZONE:UTC}

# --- Seguridad: JWT (HS256) ---
# El secreto debe tener 32 bytes o mas. El valor por defecto es SOLO para desarrollo:
# en cualquier entorno real debe definirse JWT_SECRET.
app.security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
app.security.jwt.ttl=${JWT_TTL:PT30M}
app.security.jwt.issuer=https://meeting-room-api
