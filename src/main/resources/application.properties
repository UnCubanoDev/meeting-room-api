spring.application.name=meeting-room-api

# --- Servidor ---
server.port=${SERVER_PORT:8080}

# --- Base de datos (sin credenciales reales: se inyectan por variables de entorno) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/meeting_room}
spring.datasource.username=${DB_USERNAME:meeting_room}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
# El esquema lo gestiona Flyway, no Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Documentacion OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html

# --- Errores en formato RFC 7807 (application/problem+json) ---
spring.mvc.problemdetails.enabled=true
