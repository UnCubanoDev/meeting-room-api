# Perfil de desarrollo local: activar con SPRING_PROFILES_ACTIVE=dev o
# ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# Reune todo lo que no debe llegar a otro entorno.

# Usuarios de prueba (admin/admin1234, usuario/usuario1234), ademas del esquema.
spring.flyway.locations=classpath:db/migration,classpath:db/dev-data

# Secreto JWT de desarrollo. JWT_SECRET sigue teniendo prioridad si se define.
app.security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}

# Contrasena del PostgreSQL de docker-compose.yml. DB_PASSWORD sigue teniendo prioridad.
spring.datasource.password=${DB_PASSWORD:meeting_room}
