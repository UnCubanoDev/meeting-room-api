# Perfil de test: base de datos en memoria, independiente de PostgreSQL.
# Flyway se desactiva porque sus migraciones son SQL especifico de PostgreSQL.
# El nombre incluye un valor aleatorio para que cada contexto de Spring (cacheado por
# @DataJpaTest y @SpringBootTest) use su propia base y un create-drop no afecte a otro.
spring.datasource.url=jdbc:h2:mem:meetingroom-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

spring.flyway.enabled=false
