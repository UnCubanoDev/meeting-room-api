# PostgreSQL para desarrollo local. Las credenciales coinciden con los valores por defecto del
# perfil dev (application-dev.properties), asi que basta con:
#
#   docker compose up -d
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#
# Son credenciales de desarrollo, no secretos: no reutilizarlas en ningun otro entorno.
services:
  postgres:
    image: postgres:16-alpine
    container_name: meeting-room-postgres
    environment:
      POSTGRES_DB: meeting_room
      POSTGRES_USER: meeting_room
      POSTGRES_PASSWORD: meeting_room
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting_room -d meeting_room"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
